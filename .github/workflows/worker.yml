name: Deploy order API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["worker/**", "lib/orders.mjs", "data/products.json", "data/site.json"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Skipping Worker deploy: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set."; fi
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with: { node-version: 20 }
      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy --config worker/wrangler.toml
