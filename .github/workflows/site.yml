name: Build and deploy site (with daily post)
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # daily 11:17 UTC (7:17am US Eastern in summer, 6:17am in winter)
  workflow_dispatch:
    inputs:
      generate_post:
        description: "Generate a new blog post before building"
        type: boolean
        default: false
permissions:
  contents: write      # commit the new post
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Daily post: research -> Gemini writes -> guardrails + fact-check -> content/posts/*.md
      - name: Generate daily post
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_post)
        continue-on-error: true            # a failed/flagged post must never block the site deploy (drafts go to content/drafts)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}                      # Gemini API key (repo secret)
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          LLM_MODEL: gemini-2.5-flash
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}                # optional, better source research
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}                # optional, social intent signals
          AUTO_PUBLISH: "1"
        run: node scripts/generate-post.mjs

      - name: Commit new post
        if: github.event_name != 'push'
        run: |
          git config user.name "lendappeal-blog-bot"; git config user.email "blog-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Daily post $(date -u +%F)"
          git push || true

      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}              # e.g. https://www.lendappeal.com
          API_BASE: ${{ vars.API_BASE }}              # e.g. https://lendappeal-api.<you>.workers.dev
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}    # e.g. www.lendappeal.com (writes dist/CNAME)
        run: node src/build.mjs && node scripts/check-links.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
